---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - libra.helmetica.io
  resources:
  - billingdata
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - libra.helmetica.io
  resources:
  - billingdata/finalizers
  verbs:
  - update
- apiGroups:
  - libra.helmetica.io
  resources:
  - billingdata/status
  verbs:
  - get
  - patch
  - update
